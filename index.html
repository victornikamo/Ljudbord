<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ljudbord</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--fg:#17171c;--mut:#6b6b76;--bd:#d6d6dd;--ac:#d9480f;--acfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f13;--card:#1d1d25;--fg:#eee;--mut:#9a9aa6;--bd:#33333d;--ac:#ff8a3d;--acfg:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f13;--card:#1d1d25;--fg:#eee;--mut:#9a9aa6;--bd:#33333d;--ac:#ff8a3d;--acfg:#111;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 12px 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],input[type=text],input[type=number]{flex:1;min-width:120px;width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
header input{width:auto}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;touch-action:manipulation}
button.stop{background:#c1121f;color:#fff;border-color:#c1121f;font-weight:700}
button.on,button.pri,.edit #eb{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.tab{white-space:nowrap;border-radius:20px;padding:9px 16px}
.tab.add{border-style:dashed;color:var(--mut)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px}
.edit #grid{padding-bottom:150px}
.pad{min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;text-align:left;font-size:18px;font-weight:600;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 14px;user-select:none;-webkit-user-select:none;word-break:break-word;touch-action:manipulation}
.pad small{font-size:12px;font-weight:400;color:var(--mut);min-height:14px}
.pad.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.pad.on small{color:var(--acfg)}
.edit .pad{border-style:dashed;border-width:2px}
.pad.sel{outline:4px solid var(--ac);outline-offset:-4px;border-style:solid}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar[hidden]{display:none}
#bar .row{gap:6px}
#empty,#warn{margin:16px 14px;color:var(--mut)}
#warn{color:#c1121f}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#md[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(440px,100%)}
.box h3{margin:0 0 8px}
.box label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
#mr{margin-top:16px}
.box label.chk{display:flex;gap:10px;align-items:center;color:var(--fg);font-size:17px;margin:16px 0 4px}
.box label.chk input{width:26px;height:26px;min-width:0;flex:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="row">
    <input type="search" id="q" placeholder="Sök ljud…" autocomplete="off">
    <button id="add">+ Lägg till ljud</button>
    <button id="eb">Redigera</button>
    <button id="sa" class="stop">■ Stoppa alla</button>
  </div>
  <div id="tabs"></div>
</header>
<div id="warn" hidden>Lagring fungerar inte i den här webbläsaren. Ljuden försvinner när du stänger sidan.</div>
<div id="grid"></div>
<div id="empty" hidden></div>
<div id="bar" hidden>
  <div class="row">
    <b id="cnt" style="margin-right:4px">0 valda</b>
    <button id="b-all">Markera alla</button>
    <button id="b-none">Avmarkera</button>
    <button id="b-fav">★ Favorit</button>
    <button id="b-loop">↻ Loop</button>
    <button id="b-cat">Kategori…</button>
    <button id="b-fade" class="pri">Fade…</button>
    <button id="b-name">Byt namn</button>
    <button id="b-del" style="color:#c1121f">Ta bort</button>
  </div>
</div>
<input type="file" id="file" multiple hidden>
<div id="md" hidden><div class="box"><h3 id="mt"></h3><div id="mb"></div><div id="mr" class="row"></div></div></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
let db=null,sounds=[],cats=[],cur='fav',edit=false,q='',vis=[];
const sel=new Set(),playing=new Map(),urls=new Map();
try{cats=JSON.parse(localStorage.getItem('cats')||'[]');cur=localStorage.getItem('cur')||'fav'}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('cats',JSON.stringify(cats));localStorage.setItem('cur',cur)}catch(e){}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
function openDB(){return new Promise(r=>{try{const o=indexedDB.open('ljudbord',1);o.onupgradeneeded=()=>o.result.createObjectStore('sounds',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}})}
const st=m=>db.transaction('sounds',m).objectStore('sounds');
const put=s=>{if(db)try{st('readwrite').put(s)}catch(e){}};
const del=id=>{if(db)try{st('readwrite').delete(id)}catch(e){}};
async function init(){
  db=await openDB();
  if(db){await new Promise(r=>{try{const g=st('readonly').getAll();g.onsuccess=()=>{sounds=g.result;r()};g.onerror=()=>r()}catch(e){r()}})}
  else $('#warn').hidden=false;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}
/* modal */
const closeM=()=>{$('#md').hidden=true};
function modal(title,body,btns){
  $('#mt').textContent=title;$('#mb').innerHTML=body;const r=$('#mr');r.innerHTML='';
  btns.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=()=>{if(f&&f()===false)return;closeM()};r.appendChild(b)});
  $('#md').hidden=false;
}
function ask(title,val,cb,list){
  modal(title,'<input type="text" id="mi" list="cl"><datalist id="cl"></datalist>',[['OK',()=>{const v=$('#mi').value.trim();if(!v)return false;cb(v)},'pri'],['Avbryt']]);
  $('#mi').value=val||'';(list||[]).forEach(c=>{const o=document.createElement('option');o.value=c;$('#cl').appendChild(o)});
}
const allCats=()=>[...new Set([...cats,...sounds.map(s=>s.cat)])].sort((a,b)=>a.localeCompare(b,'sv'));
const chosen=()=>{const S=sounds.filter(s=>sel.has(s.id));if(!S.length)toast('Markera ljud först');return S};
/* render */
function render(){
  const cs=allCats();
  if(cur!=='fav'&&cur!=='all'&&!cs.includes(cur))cur='fav';
  const t=$('#tabs');t.innerHTML='';
  [['fav','★ Favoriter'],['all','Alla'],...cs.map(c=>[c,c])].forEach(([id,l])=>{
    const b=document.createElement('button');b.className='tab'+(id===cur&&!q?' on':'');b.textContent=l;
    b.onclick=()=>{cur=id;q='';$('#q').value='';saveMeta();render()};t.appendChild(b);
  });
  const nb=document.createElement('button');nb.className='tab add';nb.textContent='+ Kategori';
  nb.onclick=()=>ask('Ny kategori','',v=>{if(!cats.includes(v))cats.push(v);cur=v;q='';$('#q').value='';saveMeta();render()});
  t.appendChild(nb);
  const ql=q.toLowerCase();
  vis=sounds.filter(s=>q?(s.name+' '+s.cat).toLowerCase().includes(ql):cur==='all'||(cur==='fav'?s.fav:s.cat===cur));
  vis.sort((a,b)=>a.name.localeCompare(b.name,'sv'));
  const g=$('#grid');g.innerHTML='';
  const em=$('#empty');em.hidden=vis.length>0;
  em.textContent=!sounds.length?'Inga ljud än. Tryck ”Lägg till ljud” och välj ”Välj filer”.':q?'Inga träffar.':cur==='fav'?'Inga favoriter än. Tryck ”Redigera”, markera ljud och tryck ”★ Favorit”.':'Inga ljud i den här kategorin.';
  vis.forEach(s=>{
    const b=document.createElement('div');b.setAttribute('role','button');
    b.className='pad'+(playing.has(s.id)?' on':'')+(edit&&sel.has(s.id)?' sel':'');b.dataset.id=s.id;
    const n=document.createElement('span');n.textContent=s.name;
    const m=document.createElement('small');
    m.textContent=(edit&&sel.has(s.id)?'✓ ':'')+(s.fav?'★ ':'')+(s.loop?'↻ ':'')+(s.fi?'↗ ':'')+(s.fo?'↘ ':'')+((q||cur==='all'||cur==='fav')?s.cat:'');
    b.append(n,m);
    b.onclick=()=>{if(edit){sel.has(s.id)?sel.delete(s.id):sel.add(s.id);render()}else toggle(s)};
    g.appendChild(b);
  });
  document.body.classList.toggle('edit',edit);
  $('#bar').hidden=!edit;$('#cnt').textContent=sel.size+' valda';
}
/* audio with fades (WebAudio, works on iOS) */
let ctx;
function getCtx(){const AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume();return ctx}
function mark(id){const e=document.querySelector('[data-id="'+id+'"]');if(e)e.classList.toggle('on',playing.has(id))}
function cleanup(id){const p=playing.get(id);if(!p)return;clearTimeout(p.t);clearInterval(p.iv);try{p.src.disconnect();p.g.disconnect()}catch(e){}playing.delete(id);mark(id)}
function stop(id,hard){
  const p=playing.get(id);if(!p)return;
  const s=sounds.find(x=>x.id===id),fo=(s&&s.fo)||0;
  if(hard||p.out||!fo){p.a.pause();cleanup(id);return}
  p.out=true;p.outAt=performance.now();
  p.t=setTimeout(()=>{p.a.pause();cleanup(id)},fo*1000+60);
}
function toggle(s){
  if(playing.has(s.id))return stop(s.id);
  const c=getCtx();
  let u=urls.get(s.id);if(!u){u=URL.createObjectURL(s.blob);urls.set(s.id,u)}
  const a=new Audio(u);a.loop=!!s.loop;a.preload='auto';
  const fi=s.fi||0,fo=s.fo||0;
  let src=null,g=null;
  try{src=c.createMediaElementSource(a);g=c.createGain();src.connect(g);g.connect(c.destination)}catch(e){src=g=null}
  const p={a,g,src,out:false,t:null,iv:null,outAt:0};
  const setV=v=>{v=Math.max(0,Math.min(1,v));if(g)g.gain.value=v;else a.volume=v};
  setV(fi>0?0:1);
  if(fi>0||fo>0){p.iv=setInterval(()=>{
    const t=a.currentTime,d=a.duration;let v=1;
    if(fi>0)v=Math.min(v,t/fi);
    if(fo>0&&!s.loop&&isFinite(d))v=Math.min(v,(d-t)/fo);
    if(p.out)v=Math.min(v,1-(performance.now()-p.outAt)/(fo*1000));
    setV(v)},30)}
  a.onended=()=>cleanup(s.id);
  a.onerror=()=>{cleanup(s.id);toast('Kan inte spela ”'+s.name+'”. Formatet stöds kanske inte på iPad.')};
  playing.set(s.id,p);mark(s.id);
  a.play().catch(()=>{cleanup(s.id);toast('Kan inte spela ”'+s.name+'”.')});
}
$('#sa').onclick=()=>[...playing.keys()].forEach(id=>stop(id));
$('#q').oninput=e=>{q=e.target.value.trim();render()};
$('#eb').onclick=()=>{edit=!edit;if(!edit)sel.clear();$('#eb').textContent=edit?'Klar':'Redigera';render()};
/* adding files */
$('#add').onclick=()=>$('#file').click();
const EXT=/\.(mp3|wav|wave|m4a|m4b|m4r|aac|aif|aiff|aifc|caf|flac|ogg|oga|opus|wma|amr|mp2|mpga|3gp|mp4|webm|mka|ac3|au|snd)$/i;
const isAudio=f=>(f.type&&(f.type.startsWith('audio/')||f.type==='video/mp4'||f.type==='video/webm'))||EXT.test(f.name);
$('#file').onchange=e=>{
  const cat=(cur==='fav'||cur==='all')?'Övrigt':cur;let skipped=0,n=0;
  for(const f of e.target.files){
    if(!isAudio(f)){skipped++;continue}
    const s={id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,''),cat,fav:false,loop:false,fi:0,fo:0,blob:f};
    sounds.push(s);put(s);n++;
  }
  e.target.value='';
  if(skipped)toast(skipped+' fil(er) hoppades över: inte ljudfiler.');
  else if(n)toast(n+' ljud tillagda i ”'+cat+'”.');
  if(cur==='fav')cur='all';
  render();
};
/* batch actions */
$('#b-all').onclick=()=>{vis.forEach(s=>sel.add(s.id));render()};
$('#b-none').onclick=()=>{sel.clear();render()};
$('#b-fav').onclick=()=>{const S=chosen();if(!S.length)return;const all=S.every(s=>s.fav);S.forEach(s=>{s.fav=!all;put(s)});render()};
$('#b-loop').onclick=()=>{const S=chosen();if(!S.length)return;const all=S.every(s=>s.loop);S.forEach(s=>{s.loop=!all;put(s)});render()};
$('#b-cat').onclick=()=>{const S=chosen();if(!S.length)return;ask('Flytta '+S.length+' ljud till kategori','',v=>{S.forEach(s=>{s.cat=v;put(s)});render()},allCats())};
$('#b-name').onclick=()=>{const S=chosen();if(!S.length)return;if(S.length>1)return toast('Markera bara ett ljud för att byta namn');ask('Nytt namn',S[0].name,v=>{S[0].name=v;put(S[0]);render()})};
$('#b-del').onclick=()=>{const S=chosen();if(!S.length)return;modal('Ta bort '+S.length+' ljud?','<p>Det går inte att ångra.</p>',[['Ta bort',()=>{S.forEach(s=>{stop(s.id,true);del(s.id)});sounds=sounds.filter(s=>!sel.has(s.id));sel.clear();render()},'stop'],['Avbryt']])};
$('#b-fade').onclick=()=>{
  const S=chosen();if(!S.length)return;
  const apply=(a,b)=>()=>{
    const fi=Math.max(0.2,parseFloat($('#fi').value)||2),fo=Math.max(0.2,parseFloat($('#fo').value)||3);
    S.forEach(s=>{s.fi=a?fi:0;s.fo=b?fo:0;put(s)});render();
  };
  modal('Fade för '+S.length+' ljud',
    '<label for="fi">Fade in (sekunder)</label><input type="number" id="fi" value="2" min="0.2" step="0.5" inputmode="decimal"><label for="fo">Fade out (sekunder)</label><input type="number" id="fo" value="3" min="0.2" step="0.5" inputmode="decimal"><p style="color:var(--mut);font-size:14px">Fade out körs även när du trycker på ljudet för att stoppa det.</p>',
    [['Fade in + ut',apply(true,true),'pri'],['Bara in',apply(true,false),'pri'],['Bara ut',apply(false,true),'pri'],['Ingen fade',apply(false,false)],['Avbryt']]);
};
$('#b-fade').onclick=()=>{
  const S=chosen();if(!S.length)return;
  const hi=S.every(s=>s.fi>0),ho=S.every(s=>s.fo>0);
  modal('Fade för '+S.length+' ljud',
    '<label class="chk"><input type="checkbox" id="ci"> Fade in</label><label for="fi">Längd i sekunder</label><input type="number" id="fi" min="0.2" step="0.5" inputmode="decimal"><label class="chk"><input type="checkbox" id="co"> Fade out</label><label for="fo">Längd i sekunder</label><input type="number" id="fo" min="0.2" step="0.5" inputmode="decimal"><p style="color:var(--mut);font-size:14px">Bocka ur en ruta för att stänga av den fade-typen. Fade out körs även när du stoppar ljudet med ett tryck.</p>',
    [['Spara',()=>{
      const fi=$('#ci').checked?Math.max(0.2,parseFloat($('#fi').value)||2):0;
      const fo=$('#co').checked?Math.max(0.2,parseFloat($('#fo').value)||3):0;
      S.forEach(s=>{s.fi=fi;s.fo=fo;put(s)});toast('Fade sparad för '+S.length+' ljud');render();
    },'pri'],['Avbryt']]);
  $('#ci').checked=hi;$('#co').checked=ho;
  $('#fi').value=hi?S[0].fi:2;$('#fo').value=ho?S[0].fo:3;
};
init();
</script>
</body>
</html>
